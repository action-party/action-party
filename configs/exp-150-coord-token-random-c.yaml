# ABLATION: Random fixed text embedding `c` on the Coins subset.
#
# Reviewer asked whether the text embedding does meaningful work or is
# primarily serving as a constant game identifier. This config is a
# drop-in mirror of exp-134 (the "Ours" coins baseline) with one
# change: at init, after T5-encoding the real fixed_prompt, we *overwrite*
# the cached video cross-attn embedding with a frozen random tensor of the
# same shape [1, 512, 4096], scale-matched to the real T5 output (mean/std
# from real-token positions; padding preserved as zeros).
#
# The random tensor is generated on the first run from
# `fixed_prompt_random_c_seed` and cached to `fixed_prompt_random_c_path`.
# Subsequent runs load that exact tensor from disk, so reruns / resumes
# see identical random c (no reliance on torch RNG determinism).
#
# Methodology: identical to Table-3 ablations (141/142/143/145) — starts
# from the SAME exp-135 pretrain, same 10k iters, same batch_size,
# same eval protocol. Differs from 134 only in the text embedding content.
#
# Interpretation:
#   - If metrics ≈ 134:  text was just a constant bias / game ID, not doing
#                        semantic work on coins. Reviewer answered.
#   - If metrics << 134: model was relying on the text content; either
#                        semantically or just as a specific distributional
#                        prior. Either way, the experiment tells us that.
#
# Train:
#   NODE_NUM=1 ./submit_job.sh exp-150-coord-token-random-c

generator_fsdp_wrap_strategy: size
text_encoder_fsdp_wrap_strategy: size

model_kwargs:
  timestep_shift: 5.0
  random_init: false
  cross_attn_type: masked_position_cross_attn

# Load text encoder for video token conditioning (same as pretraining)
load_vae: false
load_text_encoder: true
load_score_models: false

# === PRETRAINED CHECKPOINT (same as 134/141/142/143/145) ===
generator_ckpt: checkpoints/exp-135-base-wan-pretrain-original-actions/checkpoint_model_007000/model.pt

num_train_timestep: 1000
timestep_shift: 5.0
guidance_scale: 1.0
denoising_loss_type: flow
mixed_precision: true
seed: 42

sampling_steps: 20
sample_solver: unipc
train_on_denoising_steps: false

sharding_strategy: no_shard
gradient_checkpointing: true

# === OPTIMIZER SETTINGS ===
lr: 1.0e-04
cross_attn_lr_multiplier: 1.0
beta1: 0.9
beta2: 0.99
weight_decay: 0.0
max_grad_norm: 1.0

# === MELTING POT COINS - ORIGINAL ACTIONS DATASET ===
dataset_type: lmdb
data_path: datasets/melting_pot_coins_original_actions

# === ACTION CONDITIONING ===
use_action_only_conditioning: true
use_spatial_rope_conditioning: true
num_subjects_per_video: 2
num_subjects_total: 2
num_subjects: 2
num_action_classes: 7
latent_patch_size: 8
position_speed: 32

# === GT POSITIONS FOR SPATIAL ROPE ===
use_gt_positions_for_rope: true

# === COORDINATE TOKEN MODE (identical to 134) ===
coord_token_mode: true
coord_diffusion: true
coord_temporal_rope: true
coord_spatial_rope: true
coord_layernorm: false
coord_fourier_encoding: false
coord_direct_embedding: false
coord_no_encoder_decoder: false
coord_train_full_dit: true
coord_scale_factor: 4.0
coord_loss_weight: 1.0

# === 3D ROPE IN CROSS-ATTENTION ===
cross_attn_rope: true

# === SUBJECT ISOLATION IN SELF-ATTENTION ===
subject_isolation_self_attn: true

# === FLEX ATTENTION ===
use_flex_attention: true

# === POSITION FIXES ===
zero_position_for_masked: true
position_before_action: true

# === FIXED TEXT PROMPT FOR VIDEO TOKENS (same as 134; used as stats reference) ===
# This prompt is still T5-encoded at init (to measure scale/structure for the
# random c), but the resulting embedding is then overwritten — see below.
fixed_prompt: "Sprites moving on a grid and picking up coins"

# === ABLATION FLAGS: random fixed c ===
# Path is generated on first run and then reused on every subsequent run /
# resume. Delete the file if you want a fresh random draw.
fixed_prompt_random_c_path: checkpoints/random_fixed_c_seed42.pt
fixed_prompt_random_c_seed: 42

# Video parameters
synthetic_num_frames: 33
synthetic_height: 256
synthetic_width: 256

load_raw_video: false
batch_size: 8
overfit_single_sample: false

# EMA
ema_weight: 0.9999
ema_start_step: 100

# Logging — keep save_iters frequent so we can catch divergence early.
log_iters: 500
save_iters: 500
negative_prompt: ''
num_iter: 10000

# Video shape
image_or_video_shape:
- 1
- 9
- 16
- 32
- 32

trainer: diffusion

# === AR TRAINING MODE ===
ar_training_mode: true
per_frame_timesteps: true

teacher_forcing: false
independent_first_frame: false
noise_augmentation_max_timestep: 0

config_name: 150-coord-token-random-c
