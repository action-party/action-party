# COORDINATE TOKEN DIFFUSION on MELTING POT COINS - NO-PRETRAIN ABLATION
#
# Ablates the necessity of the pretraining phase.
#
# Mirror of exp-134-coord-token-original-actions.yaml with one change:
# starts directly from base WAN weights (no exp-135 pretrain stage) and
# runs for 17k iters to match 135's 7k + 134's 10k total compute.
#
# Comparison points (all identical except pretrain + num_iter):
#   134 (baseline):  WAN -> 135 pretrain (7k, pure video) -> 134 finetune
#                    (10k, action-conditioned) = 17k total steps.
#   151 (this cfg):  WAN -> 17k steps, action-conditioned from the start.
#
# All other settings (architecture, dataset, optimizer, batch, EMA, scheduler)
# are identical to 134 so the only independent variable is the presence of
# the 7k-step pure-video pretraining phase.
#
# Motivation: "The necessity of the 22.5k-step
# pure-video pretraining phase is not explicitly ablated." We can't afford a
# full multi-game no-pretrain run (matched compute = 86.5k steps on 46 games,
# ~5 days on 2 nodes), so we ablate the analogous 7k-step coins pretrain
# phase instead and generalize.
#
# Batch-size upscaling (bs 8 → 16): to trim wall-clock we double the
# per-GPU batch and halve the iteration count.
# Samples seen are IDENTICAL to the 134 stack:
#   134 stack:   17000 iter × 8 bs × 8 GPU = 1.088 M samples
#   151 (this):   8500 iter × 16 bs × 8 GPU = 1.088 M samples
# LR is kept at 1e-4 (no scaling).
# Expected wall-clock: ~24 h on 1 node × 8 H100 at 256×256.
#
# Train:
#   NODE_NUM=1 ./submit_job.sh exp-151-coord-token-no-pretrain

generator_fsdp_wrap_strategy: size
text_encoder_fsdp_wrap_strategy: size

model_kwargs:
  timestep_shift: 5.0
  random_init: false
  cross_attn_type: masked_position_cross_attn

# Load text encoder for video token conditioning (same as 134)
load_vae: false
load_text_encoder: true
load_score_models: false

# === NO PRETRAINED CKPT ===
# generator_ckpt is intentionally omitted — model starts from base WAN weights
# via the normal WAN loader path, with NO intermediate 7k-step pure-video
# warmup stage (this is the whole point of the ablation).

num_train_timestep: 1000
timestep_shift: 5.0
guidance_scale: 1.0
denoising_loss_type: flow
mixed_precision: true
seed: 42

sampling_steps: 20
sample_solver: unipc
train_on_denoising_steps: false

sharding_strategy: no_shard
gradient_checkpointing: true

# === OPTIMIZER SETTINGS (identical to 134) ===
lr: 1.0e-04
cross_attn_lr_multiplier: 1.0
beta1: 0.9
beta2: 0.99
weight_decay: 0.0
max_grad_norm: 1.0

# === MELTING POT COINS - ORIGINAL ACTIONS DATASET (identical to 134) ===
dataset_type: lmdb
data_path: datasets/melting_pot_coins_original_actions

# === ACTION CONDITIONING (identical to 134) ===
use_action_only_conditioning: true
use_spatial_rope_conditioning: true
num_subjects_per_video: 2
num_subjects_total: 2
num_subjects: 2
num_action_classes: 7
latent_patch_size: 8
position_speed: 32

# === GT POSITIONS FOR SPATIAL ROPE (identical to 134) ===
use_gt_positions_for_rope: true

# === COORDINATE TOKEN MODE (identical to 134) ===
coord_token_mode: true
coord_diffusion: true
coord_temporal_rope: true
coord_spatial_rope: true
coord_layernorm: false
coord_fourier_encoding: false
coord_direct_embedding: false
coord_no_encoder_decoder: false
coord_train_full_dit: true
coord_scale_factor: 4.0
coord_loss_weight: 1.0

# === 3D ROPE IN CROSS-ATTENTION (identical to 134) ===
cross_attn_rope: true

# === SUBJECT ISOLATION IN SELF-ATTENTION (identical to 134) ===
subject_isolation_self_attn: true

# === FLEX ATTENTION (identical to 134) ===
use_flex_attention: true

# === POSITION FIXES (identical to 134) ===
zero_position_for_masked: true
position_before_action: true

# === FIXED TEXT PROMPT FOR VIDEO TOKENS (identical to 134) ===
fixed_prompt: "Sprites moving on a grid and picking up coins"

# Video parameters (identical to 134)
synthetic_num_frames: 33
synthetic_height: 256
synthetic_width: 256

load_raw_video: false
# bs upped to 16 (from 134's 8) with num_iter halved so total samples seen
# matches 135+134 exactly (1.088 M samples) — see header for derivation.
batch_size: 16
overfit_single_sample: false

# EMA (identical to 134)
ema_weight: 0.9999
ema_start_step: 100

# Logging
log_iters: 500
# 8500 iters / 500 = 17 checkpoints. Step ~3500 ≈ end-of-135 in sample count
# (56 k samples), useful as an intermediate comparison point.
save_iters: 500
negative_prompt: ''

# === MATCHED COMPUTE ===
# 135 pretrain: 7k iter × bs 8  = 56 k samples per GPU (pure video)
# 134 finetune: 10k iter × bs 8 = 80 k samples per GPU (action-conditioned)
#               combined         = 136 k samples per GPU (1.088 M on 8 GPU)
# 151 (this):   8500 iter × bs 16 = 136 k samples per GPU (1.088 M on 8 GPU) ✓
num_iter: 8500

# Video shape (identical to 134)
image_or_video_shape:
- 1
- 9
- 16
- 32
- 32

trainer: diffusion

# === AR TRAINING MODE (identical to 134) ===
ar_training_mode: true
per_frame_timesteps: true

teacher_forcing: false
independent_first_frame: false
noise_augmentation_max_timestep: 0

config_name: 151-coord-token-no-pretrain
